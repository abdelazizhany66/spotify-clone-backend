services:
  spotify-clone-app:
    container_name: spotify-clone-container
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    depends_on:
      - spotify-clone-db
      - redis

  spotify-clone-db:
    image: postgres
    restart: always
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: example
      # POSTGRES_DB_NAME: spotify
    volumes:
      - postgres-db:/var/lib/postgresql/data
  redis:
    image: redis
    container_name: spotify-redis-container
    env_file:
      - ./.env
    command: redis-server --requirepass "${REDIS_PASSWORD}"



volumes:
  postgres-db: